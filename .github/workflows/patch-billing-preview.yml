name: Apply billing UI patch on preview branch
on:
  push:
    branches: [fix/stripe-checkout-safe-preview]
    paths: [scripts/patch_billing_status.py, .github/workflows/patch-billing-preview.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stripe-checkout-safe-preview
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_billing_status.py
      - name: Commit preview frontend patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html
          if ! git diff --cached --quiet; then
            git commit -m "Update Billing status UI and Free plan labels in preview"
            git push
          fi
