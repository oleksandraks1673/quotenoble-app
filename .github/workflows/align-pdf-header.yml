name: Align PDF logo and company header
on:
  push:
    branches: [feature/quote-invoice-polish-20261016]
    paths: ['.github/workflows/align-pdf-header.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align company and logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          edits=[
            ('scale=Math.min(70/props.width,58/props.height)', 'scale=Math.min(80/props.width,48/props.height)'),
            ('"JPEG",M,25,logoW,props.height*scale)', '"JPEG",M+4,27+(48-props.height*scale)/2,logoW,props.height*scale)'),
            ('const bx=M+(logoW?logoW+14:0);', 'const bx=M+(logoW?logoW+22:0);'),
            ('font(17,true);color(ink);', 'font(16,true);color(ink);'),
            ('Math.max(130,310-(bx-M))', 'Math.max(130,320-(bx-M))'),
            ('Math.max(135,310-(bx-M))', 'Math.max(135,320-(bx-M))')
          ]
          for old,new in edits:
            assert s.count(old)==1, (old,s.count(old))
            s=s.replace(old,new,1)
          Path('index.html').write_text(s)
          Path('app.html').write_text(s)
          assert Path('index.html').read_bytes()==Path('app.html').read_bytes()
          print('PASS: header alignment updated on both entry points')
          PY
      - name: Commit safe header fix
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          git diff --cached --quiet || (git commit -m "Align PDF company and logo header" && git push)
