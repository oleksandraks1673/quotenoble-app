name: Quote Noble Android internal build
on:
  workflow_dispatch:
  push:
    branches: [android-internal-test-build]
    paths:
      - 'android/**'
      - '.github/workflows/android-internal.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --licenses < /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare original Quote Noble launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp app/src/main/brand-logo-original.png app/src/main/res/drawable-nodpi/ic_launcher.png
      - name: Build debug APK and unsigned release AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: QuoteNoble-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QuoteNoble-unsigned-aab-NOT-FOR-PLAY-UPLOAD
          path: android/app/build/outputs/bundle/release/*.aab
