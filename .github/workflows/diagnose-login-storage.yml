name: Diagnose login storage reference
on:
  push:
    branches: [feature/quote-invoice-polish-20261016]
    paths: ['.github/workflows/diagnose-login-storage.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect storage reference and login code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          lines=s.splitlines()
          terms=['storage is not defined','storage.', 'storage[','const storage','let storage','var storage','async function login','signInWithPassword','getSession','localStorage','sessionStorage']
          out=[]
          for term in terms:
            hits=[i for i,l in enumerate(lines) if term.lower() in l.lower()]
            out.append(f'### {term}: {len(hits)}')
            for i in hits[:35]:
              out.extend(f'{j+1}: {lines[j][:320]}' for j in range(max(0,i-2),min(len(lines),i+3)))
          Path('login-storage-audit.txt').write_text('\\n'.join(out)[:70000])
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add login-storage-audit.txt
          git diff --cached --quiet || (git commit -m "Audit undefined login storage variable" && git push)
