name: Apply Quote Noble preview fixes
on:
  push:
    branches:
      - fix/billing-portal-access-20261017
    paths:
      - scripts/apply-smart-template-pdf.py
      - .github/workflows/apply-quote-preview-fixes.yml
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/billing-portal-access-20261017
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch app files
        run: python scripts/apply-smart-template-pdf.py
      - name: Commit preview patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore Smart Templates and matching quote invoice PDF design"
            git push
          fi
