name: Add modern billing to working login
on:
  push:
    branches: [fix/billing-on-working-login-20261016]
    paths: ['.github/workflows/add-modern-billing.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch billing only, preserve sign-in
        run: |
          from pathlib import Path
          import re
          for filename in ('app.html','index.html'):
           p=Path(filename);s=p.read_text()
           start=s.index('  <!-- PLANS: Stripe checkout requires server configuration -->')
           end=s.index('  <!-- HELP -->',start)
           panel="""  <section id="view-plans" class="view">
            <div class="qn-bill">
              <div class="qn-bill-heading"><span class="qn-bill-icon">✦</span><div><h2>Billing & Subscription</h2><p>Manage your Quote.Noble membership securely.</p></div></div>
              <div class="qn-bill-current"><div class="qn-bill-label">CURRENT PLAN</div><div class="qn-bill-line"><strong id="qn-current-plan">Checking your plan…</strong><span id="qn-plan-badge">Checking</span></div><p id="qn-renewal">Please wait while we verify your subscription.</p></div>
              <div class="qn-bill-section"><h3>Choose your plan</h3><p>Simple pricing, billed in Canadian dollars.</p><div class="qn-bill-options">
                <button type="button" class="qn-bill-option selected" data-qn-plan="monthly"><span>Monthly Pro</span><strong>$14.99</strong><small>CAD / month</small></button>
                <button type="button" class="qn-bill-option" data-qn-plan="yearly"><span>Yearly Pro</span><strong>$149.99</strong><small>CAD / year · Save 17%</small></button>
              </div></div>
              <div id="qn-bill-unknown"><p id="qn-pro-status" role="status" aria-live="polite">Checking subscription…</p><button type="button" id="qn-pro-refresh" class="qn-bill-secondary">Refresh subscription status</button></div>
              <div id="qn-bill-free" hidden><button type="button" id="qn-pro-continue" class="qn-bill-primary">Continue with Monthly Pro →</button></div>
              <div id="qn-bill-active" hidden><p class="qn-bill-hint">Your Pro subscription is active. Use Stripe to change plans, update payment details or cancel.</p><button type="button" id="qn-pro-manage" class="qn-bill-primary">Manage subscription →</button><div class="qn-bill-actions"><button type="button" id="qn-change-plan" class="qn-bill-secondary">Change plan ↗</button><button type="button" id="qn-cancel-plan" class="qn-bill-secondary">Cancel subscription ↗</button></div></div>
              <button type="button" class="qn-bill-back" data-action="back-more">← Back to More</button>
            </div></section>
          """
           s=s[:start]+panel+s[end:]
           needle='<button type="button" class="qn-more-item" data-qn-more-panel="qn-more-membership"'
           if needle not in s:raise Exception(filename+' More anchor missing')
           s=s.replace(needle,'<button type="button" class="qn-more-item" data-qn-more-go="plans"><span class="qn-more-item-icon">▣</span><span><strong>Billing &amp; Subscription</strong><small>Current plan, upgrade, change or cancel</small></span><b>›</b></button>\n      '+needle,1)
           css="""<style id="qn-bill-modern-css">
          .qn-bill{max-width:760px;margin:12px auto 32px;padding:22px;border:1px solid #e8e9ed;border-radius:26px;background:#fff;box-shadow:0 12px 32px rgba(15,23,42,.06);color:#192437}.qn-bill-heading{display:flex;align-items:center;gap:14px;margin-bottom:22px}.qn-bill-icon{width:52px;height:52px;border-radius:16px;background:#fff3e4;color:#c46a00;display:grid;place-items:center;font-size:28px;flex-shrink:0}.qn-bill-heading h2{margin:0 0 4px;font-size:1.5rem}.qn-bill-heading p,.qn-bill-section>p{margin:0;color:#6b7280;font-size:.92rem}.qn-bill-current{background:#fff8ef;border:1px solid #f1d4b0;border-radius:19px;padding:20px;margin-bottom:22px}.qn-bill-label{font-size:.72rem;letter-spacing:.09em;font-weight:800;color:#9a5b19}.qn-bill-line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}.qn-bill-line strong{font-size:1.3rem}.qn-bill-line span{border-radius:99px;background:#fff;padding:6px 10px;font-size:.76rem;font-weight:700}.qn-bill-current p{margin:0;color:#6b7280;font-size:.85rem}.qn-bill-section h3{margin:0 0 5px;font-size:1.13rem}.qn-bill-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0 20px}.qn-bill-option{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border:2px solid #e4e7eb;border-radius:17px;background:#fff;color:#192437;cursor:pointer}.qn-bill-option.selected{border-color:#e98c23;background:#fffaf4}.qn-bill-option span{font-weight:800}.qn-bill-option strong{font-size:1.6rem}.qn-bill-option small{color:#64748b;font-size:.78rem}.qn-bill-primary,.qn-bill-secondary{display:block!important;width:100%!important;min-width:0!important;box-sizing:border-box!important;border-radius:13px;padding:16px 12px;font-weight:800;font-size:1rem;text-align:center;white-space:normal;cursor:pointer}.qn-bill-primary{background:#df7c0b;color:#fff;border:0}.qn-bill-secondary{background:#f8f9fb;color:#273449;border:1px solid #d9dce2}.qn-bill-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.qn-bill-hint{color:#657181;font-size:.88rem;line-height:1.5}.qn-bill-back{display:block;margin:22px auto 0;padding:12px;border:0;background:transparent;color:#64748b;font-weight:750;cursor:pointer}#qn-pro-status{font-size:.85rem;color:#64748b;text-align:center}#qn-bill-free[hidden],#qn-bill-active[hidden],#qn-bill-unknown[hidden]{display:none!important}@media(max-width:410px){.qn-bill{padding:16px;border-radius:18px}.qn-bill-options{gap:8px}.qn-bill-option{padding:12px}.qn-bill-option strong{font-size:1.3rem}.qn-bill-actions{grid-template-columns:1fr}}
          </style>"""
           s=s.replace('</head>',css+'</head>',1)
           begin=s.index('<script>\n/* Quote.Noble subscription client:')
           finish=s.index('</script>',begin)+len('</script>')
           script="""<script>
          /* Quote.Noble billing: leave the existing Supabase sign-in implementation untouched. */
          (()=>{
           const supabaseUrl='https://jssfjaggsjtwppokjpns.supabase.co';
           const publishableKey='sb_publishable_9Nr32yruSbg_VXyZiowqJA_BynvkOCt';
           let selected='monthly',verified=false,active=false;
           const el=id=>document.getElementById(id);
           const message=t=>{if(el('qn-pro-status'))el('qn-pro-status').textContent=t};
           const show=(id,on)=>{if(el(id))el(id).hidden=!on};
           async function api(path,body){
             if(!window.supabase?.createClient)throw Error('Sign-in service is unavailable. Please refresh.');
             const client=window.supabase.createClient(supabaseUrl,publishableKey);
             const {data,error}=await client.auth.getSession();
             if(error||!data?.session?.access_token)throw Error('Please sign in to manage your subscription.');
             const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+data.session.access_token},body:JSON.stringify(body||{})});
             const json=await response.json().catch(()=>({}));
             if(!response.ok)throw Error(json.error||'Billing service unavailable');
             return json;
           }
           function select(plan){selected=plan;document.querySelectorAll('[data-qn-plan]').forEach(b=>b.classList.toggle('selected',b.dataset.qnPlan===plan));if(el('qn-pro-continue'))el('qn-pro-continue').textContent='Continue with '+(plan==='yearly'?'Yearly':'Monthly')+' Pro →'}
           async function refresh(){
             verified=false;show('qn-bill-free',false);show('qn-bill-active',false);show('qn-bill-unknown',true);message('Checking your subscription…');
             try{
               const r=await api('/api/stripe/status');
               verified=true;active=!!r.pro;
               if(el('qn-current-plan'))el('qn-current-plan').textContent=active?(r.plan==='yearly'?'Yearly Pro':r.plan==='monthly'?'Monthly Pro':'Pro (active)'):'Free';
               if(el('qn-plan-badge'))el('qn-plan-badge').textContent=active?(r.cancel_at_period_end?'Cancelling':'Active'):'Free';
               if(el('qn-renewal'))el('qn-renewal').textContent=active?(r.current_period_end?'Current period ends '+new Date(r.current_period_end*1000).toLocaleDateString('en-CA'):'Subscription verified'):'Upgrade when you are ready.';
               show('qn-bill-unknown',false);show('qn-bill-active',active);show('qn-bill-free',!active);
             }catch(e){if(el('qn-current-plan'))el('qn-current-plan').textContent='Unable to verify';if(el('qn-plan-badge'))el('qn-plan-badge').textContent='Unknown';message(e.message)}
           }
           async function redirect(path,body){
             try{
               if(!verified)throw Error('Verify your subscription first.');
               if(path.endsWith('/checkout')&&active)throw Error('You already have Pro. Use Manage subscription.');
               if(path.endsWith('/portal')&&!active)throw Error('No active subscription was found.');
               const r=await api(path,body);
               const url=new window.URL(r.url);
               if(url.protocol!=='https:')throw Error('Invalid secure billing link.');
               window.location.assign(url.href);
             }catch(e){message(e.message);show('qn-bill-unknown',true)}
           }
           document.addEventListener('click',e=>{
             const choice=e.target.closest('[data-qn-plan]');if(choice){select(choice.dataset.qnPlan);return}
             if(e.target.closest('#qn-pro-continue')){redirect('/api/stripe/checkout',{plan:selected});return}
             if(e.target.closest('#qn-pro-manage,#qn-change-plan,#qn-cancel-plan,#cloud-portal')){redirect('/api/stripe/portal');return}
             if(e.target.closest('#qn-pro-refresh')){refresh();return}
             if(e.target.closest('[data-qn-more-go="plans"],[data-action="view-plans"]'))setTimeout(refresh,180);
           });
           window.qnSubscriptionStatus=()=>api('/api/stripe/status');
           window.qnRefreshBilling=refresh;
           select('monthly');
          })();
          </script>"""
           s=s[:begin]+script+s[finish:]
           if 'id="qn-bill-modern-css"' not in s or 'id="qn-current-plan"' not in s:raise Exception('Patch failed '+filename)
           p.write_text(s)
           print(filename,'patched',len(s))
          
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html
          git diff --cached --quiet || (git commit -m "Add modern billing screen while preserving working login" && git push)
