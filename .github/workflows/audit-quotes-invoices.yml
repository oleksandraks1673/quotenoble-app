name: Audit quotes and invoices
on:
  push:
    branches: [feature/quote-invoice-polish-20261016]
    paths: ['.github/workflows/audit-quotes-invoices.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify quote, invoice and print code without altering app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          terms=['function print','function export','window.print','@media print','printQuote','printInvoice','quote-preview','invoice-preview','html2pdf','jsPDF','pdf','quoteTotal','invoiceTotal']
          lines=s.splitlines()
          out=['QUOTE AND INVOICE AUDIT — code references only, no customer data']
          for term in terms:
            hits=[i for i,line in enumerate(lines) if term.lower() in line.lower()]
            out.append(f'{term}: {len(hits)} matches at lines '+','.join(str(i+1) for i in hits[:30]))
            for i in hits[:3]:
              snippet=lines[i][:250]
              snippet=re.sub(r'(?i)(sk_live_|sk_test_|whsec_|eyJ)[A-Za-z0-9_./-]+','[REDACTED]',snippet)
              out.append(f'  {i+1}: {snippet}')
          for a,b in [(640,685),(1125,1225),(1225,1300)]:
            out.append(f'\\n=== SOURCE LINES {a}-{b} ===')
            for i in range(a-1,min(b,len(lines))):
              out.append(f'{i+1}: {lines[i][:300]}')
          Path('quote-invoice-audit.txt').write_text('\n'.join(out)[:60000])
          PY
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quote-invoice-audit.txt
          git diff --cached --quiet || (git commit -m "Document quote and invoice layout implementation" && git push)
