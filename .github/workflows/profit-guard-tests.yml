name: Profit Guard tests
on:
  push:
    branches: [fix/quote-noble-safety-profit-guard]
  pull_request:
    paths:
      - 'features/profit-guard*.mjs'
      - '.github/workflows/profit-guard-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test features/profit-guard.test.mjs
