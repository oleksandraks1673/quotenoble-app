name: Improve PDF text readability
on:
  push:
    branches: [fix/billing-portal-access-20261017]
    paths: ['.github/workflows/improve-pdf-text-readability.yml']
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase PDF type size and maintain pagination
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes=[
            ('font(row.bold?10:9,row.bold);color(row.bold?ink:muted);','font(row.bold?11:10,row.bold);color(row.bold?ink:muted);'),
            ('text(row.v,M+12,y);y+=13.5;','text(row.v,M+12,y);y+=15;'),
            ('const available=Math.max(1,Math.floor((713-y)/13.5));','const available=Math.max(1,Math.floor((713-y)/15));')
          ]
          for name in ('index.html','app.html'):
            p=Path(name);s=p.read_text()
            for old,new in changes:
              n=s.count(old)
              assert n==1, f'{name}: expected 1 occurrence, got {n}: {old[:65]}'
              s=s.replace(old,new,1)
            p.write_text(s)
          assert Path('index.html').read_bytes()==Path('app.html').read_bytes()
          PY
      - name: Commit updated PDF typography
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html
          git diff --cached --quiet || (git commit -m "Enlarge PDF text and adjust description pagination" && git push)
