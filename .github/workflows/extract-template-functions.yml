name: Extract template functions
on:
  push:
    branches: [release/combined-app-billing-20261016]
    paths: ['.github/workflows/extract-template-functions.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text().splitlines()
          out=[]
          for i,line in enumerate(s):
            if 850<=i<=1150 and re.search('template',line,re.I):
              for j in range(max(0,i-3),min(len(s),i+7)):
                if j not in [x[0] for x in out]:
                  t=s[j][:900]
                  if re.search('supabase|secret|token|apikey|password',t,re.I):t='[REDACTED]'
                  out.append((j,t))
          Path('template-functions-extract.txt').write_text('\n'.join(f'{i+1}: {t}' for i,t in sorted(out))[:45000])
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template-functions-extract.txt
          git diff --cached --quiet || (git commit -m "Extract template handlers for repair" && git push)
