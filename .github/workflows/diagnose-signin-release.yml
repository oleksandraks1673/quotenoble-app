name: Diagnose sign-in release
on:
  push:
    branches: [release/combined-app-billing-20261016]
    paths: ['.github/workflows/diagnose-signin-release.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create redacted auth diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          out=[]
          terms=['Sign-in service is not available','createClient','window.supabase','supabase-js','signInWithPassword' ,'SUPABASE_PUBLISHABLE_KEY','SUPABASE_ENDPOINT','const KEY','start();','start().catch','async function start']
          for f in ['index.html','app.html']:
            s=Path(f).read_text()
            out.append(f'FILE {f} length {len(s)}')
            for term in terms:
              pos=[m.start() for m in re.finditer(re.escape(term),s,re.I)]
              out.append(f'TERM {term} count {len(pos)}')
              for p in pos[:3]:
                sn=s[max(0,p-400):p+450]
                sn=re.sub(r'eyJ[A-Za-z0-9._-]{20,}', '[JWT]',sn)
                sn=re.sub(r'https://[a-z0-9-]+\.supabase\.co','[SUPABASE_HOST]',sn)
                sn=re.sub(r'(?i)(?:sb_publishable_|sb_secret_)[A-Za-z0-9_-]+','[SUPABASE_KEY]',sn)
                sn=re.sub(r'(?i)(?:sk_live_|sk_test_|pk_live_|pk_test_)[A-Za-z0-9_-]+','[STRIPE_KEY]',sn)
                out.append('CONTEXT '+re.sub(r'\s+',' ',sn))
          Path('signin-diagnostic.txt').write_text('\n'.join(out))
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signin-diagnostic.txt
          git diff --cached --quiet || (git commit -m "Record sanitized sign-in diagnostic" && git push)
