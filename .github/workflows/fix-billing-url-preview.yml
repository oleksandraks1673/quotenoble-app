name: Fix Quote.Noble billing URL on preview
on:
  push:
    branches: [fix/billing-design-preview-20261016]
    paths:
      - '.github/workflows/fix-billing-url-preview.yml'
permissions:
  contents: write
jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace shadowed URL constructor in billing client
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('app.html', 'index.html'):
              path = Path(name)
              content = path.read_text()
              old = 'new URL(r.url)'
              new = 'new window.URL(r.url)'
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly 1 URL call, found {count}')
              path.write_text(content.replace(old, new))
              print(f'Fixed {name}')
          PY
      - name: Commit verified change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html index.html
          git commit -m "Fix Stripe portal redirect URL constructor" 
          git push
